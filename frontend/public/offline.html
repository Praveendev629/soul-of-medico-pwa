<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Soul of Medico - Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background: #f9fafb; }
        .container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .content { text-align: center; max-width: 400px; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 10px; color: #1f2937; }
        p { color: #6b7280; margin-bottom: 20px; }
        button { background: #0052CC; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="icon">📡</div>
            <h1>You are Offline</h1>
            <p>It looks like your internet connection is unavailable. Check your connection and try again.</p>
            <p>You can still access your downloaded lectures and notes!</p>
            <button onclick="location.reload()">Retry</button>
        </div>
    </div>
</body>
</html>
